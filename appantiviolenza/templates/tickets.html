<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Tickets</title>
</head>
<body>
    <h1>pagina dei tickets</h1>

    <div class="row g-3">
        <form class="row g-3" method="POST">
            {% csrf_token %}
            <div class="col-md-6">
                <label for="inputUsername" class="form-label">Nome Utente</label>
                <input type="text" name="username" id="username"  class="form-control"/>
            </div>
            <div class="col-md-6">
                <label for="inputAge" class="form-label">Fascia d'età</label>
                <select name="fascia_eta" id="fasciaEta" class="form-select">
                    {% for eta in fascie_eta %}
                        <option value="{{ eta }}">{{ eta }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="inputTelefono" class="form-label">Telefono</label>
                <input type="text" name="telefono" id="telefono" class="form-control" placeholder="telefono" />
            </div>
            <div class="col-md-6">
                <label for="inputState" class="form-label">Regione</label>
                <select id="inputState" class="form-select" name="regione_provenienza">
                {% for regione in regioni_italia %}
                    <option value="{{ regione }}">{{ regione }}</option>
                {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Email</label>
                <input type="email" name="email" id="email" class="form-email form-control" name="email">
            </div>
            <div class="col-md-6">
                <label for="inputPassword4" class="form-label">Password</label>
                <input type="password" class="form-control" id="inputPassword4" name="password">
            </div>
            <div class="col-md-6">
                <button type="submit" class="btn btn-primary">Sign in</button>
            </div>
        </form>
        <div class="row g-3 col-md-6">
            <form method="get">
                <label for="loginBtn" class="form-label text-center">Hai già un account?</label>
                <button type="submit" class="btn btn-primary" name="mode" value="login">Accedi</button>
            </form>
        </div>
    </div>
</body>
</html>
