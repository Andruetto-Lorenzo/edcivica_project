<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-p width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <title>1522 login page</title>
</head>
<body>
    <header>
        <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
            <div class="container-fluid">
              <div class="navbar-header">
                <a class="navbar-brand" href="{% url 'home' %}">
                  <img src="" alt="Logo">
                </a>

                <button class="navbar-en">
                    <img src="" alt="english_language">
                </button>
              </div>
            </div>
        </nav>
    </header>
    <div class="container-form-login row g-3">
        <form action="" method="post">
            {% csrf_token %}
            <input type="text" name="nome_utente" id="nome_utente" placeholder="Nome Utente"/>
            <input type="password" name="password" id="pass" placeholder="Password"/>
            <button type="submit" class="btn btn-primary">Accedi</button>
        </form>
        <form method="get">
            <label for="registerBtn form-label text-center">Non hai un account?</label>
            <button type="submit" class="btn btn-primary" name="mode" value="register">Registrati</button>
        </form>
    </div>
</body>
</html>
