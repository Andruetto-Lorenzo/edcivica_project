<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso Operatori - 1522</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

</head>
<body>

<div class="topbar">
    <span class="topbar-brand">1522</span>
    <a href="{% url 'home' %}">← Torna alla home</a>
</div>

<main>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="icon">🔑</div>
                <h1>Accesso Operatori</h1>
                <p>Area riservata ai soli operatori</p>
            </div>

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Nome utente</label>
                    <input type="text" id="username" name="username"
                           placeholder="Inserisci il tuo username"
                           autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-submit">Accedi</button>
            </form>

            <a href="{% url 'home' %}" class="back-link">← Torna alla pagina principale</a>
        </div>
    </div>
</main>

<footer>© 2024 Presidenza del Consiglio dei Ministri - Dipartimento per le Pari Opportunità</footer>
</body>
</html>
